name: acxel
description: ACXEL is a digital cell biology company building advanced microfluidics platforms
  and productivity tools for life sciences research and drug development. Its self-developed
  AP-LOC (Active Pixel Lab-on-Chip) technology enables high-throughput, parallel, and precise
  microdroplet manipulation, alongside AM-EWOD and AM-DMF digital microfluidic platforms
  supporting cell sorting, cell therapy, antibody therapy, synthetic biology, and chemical
  synthesis with full-process chip integration and real-time feedback monitoring. Surfaced as
  a portfolio company of Qiming Venture Partners. ACXEL is a hardware and platform provider and
  publishes no public developer/API surface as of this enrichment pass.
